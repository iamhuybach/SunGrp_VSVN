user_decisions_2026_10_13:
  q1: Keep bronze source_name, source_id, and language_code. Paired samples show raw.id
    equals normalized.source_id. poi_id stays HASH_MD5_UUID of those bronze columns.
  q2: Each raw_payload cell is one JSON object.
  q3: Child DOC tables use src_object dollar and MERGE null overwrites old rows.
  q4: Drop columns that the raw extract will not fill. Change NB_CREATE_DDL as a first-time
    create. Do not deactivate them with is_active false.
  comparison_evidence: evidence/payload-pair-comparison.md
  media: Keep every raw photo. display_order is the 1-based index. Fill width_px and
    height_px from widthPx and heightPx.
  dropped_columns_confirmed:
  - slv_3p_poi.business_sector
  - slv_3p_poi.business_category
  - slv_3p_poi.slug
  - slv_3p_poi_address.district
