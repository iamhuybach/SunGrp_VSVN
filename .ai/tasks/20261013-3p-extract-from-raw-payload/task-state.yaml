  - slv_3p_poi_address.timezone
  - slv_3p_poi_contact.phone
  - slv_3p_poi_contact.phone_raw
  - slv_3p_poi_policy
  - poi_content
  - inactive slug and partner columns
  open_now: currentOpeningHours.openNow, else regularOpeningHours.openNow. Periods
    and weekday_text stay on regularOpeningHours. The current date key is not written
    into the flattened period.
  q16: Old bronze rows have raw_payload. A full init still runs. No version fence
    is required for missing raw_payload.
  secondary_hours: Do not store regularSecondaryOpeningHours.
  amenity_l1: slv_3p_poi_amenity.source_flags_json uses the JSON shape in evidence/context/amenity-l1-demo.md.
